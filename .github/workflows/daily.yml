name: Daily dashboard rebuild

on:
  schedule:
    # Every 5 minutes — the lowest cadence GitHub Actions cron supports.
    # Each runner has their own personal Strava app, so webhooks aren't
    # practical (each runner would need to subscribe their own app), and
    # this cadence gets us to ~5-min freshness without that complexity.
    #
    # API volume: 288 builds/day × ~1 call/runner (access tokens cached
    # for 6h) ≈ 288 calls/day per runner — well under Strava's 2000/day
    # per-app rate limit. Each runner has their own 2000/day bucket.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the Strava access-token cache from previous runs so we don't
      # have to refresh every runner's token on every build. Tokens are
      # valid 6 hours; with 20-min cadence this cuts API calls roughly in half.
      - name: Restore Strava token cache
        uses: actions/cache@v4
        with:
          path: cache/strava_tokens.json
          key: strava-tokens-${{ github.run_id }}
          restore-keys: |
            strava-tokens-

      - name: Build dashboard
        env:
          # Each runner has their own personal Strava app, so we need 3
          # secrets per runner: their client_id, client_secret, and
          # refresh_token. Runners without all 3 secrets set are shown as
          # "Not connected" on the dashboard — no error, just skipped.
          LOUIS_CLIENT_ID:        ${{ secrets.LOUIS_CLIENT_ID }}
          LOUIS_CLIENT_SECRET:    ${{ secrets.LOUIS_CLIENT_SECRET }}
          LOUIS_REFRESH_TOKEN:    ${{ secrets.LOUIS_REFRESH_TOKEN }}
          BROTHER1_CLIENT_ID:     ${{ secrets.BROTHER1_CLIENT_ID }}
          BROTHER1_CLIENT_SECRET: ${{ secrets.BROTHER1_CLIENT_SECRET }}
          BROTHER1_REFRESH_TOKEN: ${{ secrets.BROTHER1_REFRESH_TOKEN }}
          BROTHER2_CLIENT_ID:     ${{ secrets.BROTHER2_CLIENT_ID }}
          BROTHER2_CLIENT_SECRET: ${{ secrets.BROTHER2_CLIENT_SECRET }}
          BROTHER2_REFRESH_TOKEN: ${{ secrets.BROTHER2_REFRESH_TOKEN }}
          MATT_CLIENT_ID:         ${{ secrets.MATT_CLIENT_ID }}
          MATT_CLIENT_SECRET:     ${{ secrets.MATT_CLIENT_SECRET }}
          MATT_REFRESH_TOKEN:     ${{ secrets.MATT_REFRESH_TOKEN }}
          WILL_CLIENT_ID:         ${{ secrets.WILL_CLIENT_ID }}
          WILL_CLIENT_SECRET:     ${{ secrets.WILL_CLIENT_SECRET }}
          WILL_REFRESH_TOKEN:     ${{ secrets.WILL_REFRESH_TOKEN }}
          FREDDY_CLIENT_ID:       ${{ secrets.FREDDY_CLIENT_ID }}
          FREDDY_CLIENT_SECRET:   ${{ secrets.FREDDY_CLIENT_SECRET }}
          FREDDY_REFRESH_TOKEN:   ${{ secrets.FREDDY_REFRESH_TOKEN }}
          FRIEND7_CLIENT_ID:      ${{ secrets.FRIEND7_CLIENT_ID }}
          FRIEND7_CLIENT_SECRET:  ${{ secrets.FRIEND7_CLIENT_SECRET }}
          FRIEND7_REFRESH_TOKEN:  ${{ secrets.FRIEND7_REFRESH_TOKEN }}
          FRIEND8_CLIENT_ID:      ${{ secrets.FRIEND8_CLIENT_ID }}
          FRIEND8_CLIENT_SECRET:  ${{ secrets.FRIEND8_CLIENT_SECRET }}
          FRIEND8_REFRESH_TOKEN:  ${{ secrets.FRIEND8_REFRESH_TOKEN }}
          FRIEND9_CLIENT_ID:      ${{ secrets.FRIEND9_CLIENT_ID }}
          FRIEND9_CLIENT_SECRET:  ${{ secrets.FRIEND9_CLIENT_SECRET }}
          FRIEND9_REFRESH_TOKEN:  ${{ secrets.FRIEND9_REFRESH_TOKEN }}
          FRIEND10_CLIENT_ID:     ${{ secrets.FRIEND10_CLIENT_ID }}
          FRIEND10_CLIENT_SECRET: ${{ secrets.FRIEND10_CLIENT_SECRET }}
          FRIEND10_REFRESH_TOKEN: ${{ secrets.FRIEND10_REFRESH_TOKEN }}
          FRIEND11_CLIENT_ID:     ${{ secrets.FRIEND11_CLIENT_ID }}
          FRIEND11_CLIENT_SECRET: ${{ secrets.FRIEND11_CLIENT_SECRET }}
          FRIEND11_REFRESH_TOKEN: ${{ secrets.FRIEND11_REFRESH_TOKEN }}
          FRIEND12_CLIENT_ID:     ${{ secrets.FRIEND12_CLIENT_ID }}
          FRIEND12_CLIENT_SECRET: ${{ secrets.FRIEND12_CLIENT_SECRET }}
          FRIEND12_REFRESH_TOKEN: ${{ secrets.FRIEND12_REFRESH_TOKEN }}
          FRIEND13_CLIENT_ID:     ${{ secrets.FRIEND13_CLIENT_ID }}
          FRIEND13_CLIENT_SECRET: ${{ secrets.FRIEND13_CLIENT_SECRET }}
          FRIEND13_REFRESH_TOKEN: ${{ secrets.FRIEND13_REFRESH_TOKEN }}
        run: python scripts/build_dashboard.py

      - name: Commit refreshed HTML if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily dashboard refresh ($(date -u +%Y-%m-%d))"
            git push
          fi

      # connect.html is purely static — it walks each runner through creating
      # their own Strava app and exchanges the OAuth code via the worker.
      # No build-time credential injection needed.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
