name: Daily dashboard rebuild

on:
  schedule:
    # Hourly cron as a safety net — webhooks do the heavy lifting now, but
    # if Strava ever misses or our Worker is down, we still get one refresh
    # per hour. Daily call count: 24 × ~21 fetches = ~500 calls.
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  # Cloudflare Worker fires this whenever any connected athlete posts/edits
  # a run. Workflow rebuilds immediately — typically <60 sec end-to-end.
  repository_dispatch:
    types: [strava-webhook]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the Strava access-token cache from previous runs so we don't
      # have to refresh every runner's token on every build. Tokens are
      # valid 6 hours; with 20-min cadence this cuts API calls roughly in half.
      - name: Restore Strava token cache
        uses: actions/cache@v4
        with:
          path: cache/strava_tokens.json
          key: strava-tokens-${{ github.run_id }}
          restore-keys: |
            strava-tokens-

      - name: Build dashboard
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_TOKEN_LOUIS: ${{ secrets.STRAVA_TOKEN_LOUIS }}
          STRAVA_TOKEN_BROTHER1: ${{ secrets.STRAVA_TOKEN_BROTHER1 }}
          STRAVA_TOKEN_BROTHER2: ${{ secrets.STRAVA_TOKEN_BROTHER2 }}
          STRAVA_TOKEN_MATT: ${{ secrets.STRAVA_TOKEN_MATT }}
          STRAVA_TOKEN_WILL: ${{ secrets.STRAVA_TOKEN_WILL }}
          STRAVA_TOKEN_FREDDY: ${{ secrets.STRAVA_TOKEN_FREDDY }}
          STRAVA_TOKEN_FRIEND7: ${{ secrets.STRAVA_TOKEN_FRIEND7 }}
          STRAVA_TOKEN_FRIEND8: ${{ secrets.STRAVA_TOKEN_FRIEND8 }}
          STRAVA_TOKEN_FRIEND9: ${{ secrets.STRAVA_TOKEN_FRIEND9 }}
          STRAVA_TOKEN_FRIEND10: ${{ secrets.STRAVA_TOKEN_FRIEND10 }}
          STRAVA_TOKEN_FRIEND11: ${{ secrets.STRAVA_TOKEN_FRIEND11 }}
          STRAVA_TOKEN_FRIEND12: ${{ secrets.STRAVA_TOKEN_FRIEND12 }}
          STRAVA_TOKEN_FRIEND13: ${{ secrets.STRAVA_TOKEN_FRIEND13 }}
        run: python scripts/build_dashboard.py

      - name: Commit refreshed HTML if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily dashboard refresh ($(date -u +%Y-%m-%d))"
            git push
          fi

      # No credentials injection needed — connect.html now calls the
      # Cloudflare Worker's /exchange endpoint, which holds the client_secret
      # server-side. client_id (243802) is public and safely hardcoded.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
