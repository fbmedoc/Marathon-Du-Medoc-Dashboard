# Cloudflare Worker config for the Le Marathon Du Médoc 26 webhook receiver.
#
# Deploy:
#   cd webhook
#   wrangler deploy
#
# Set secrets (one-time, only needed once per worker):
#   wrangler secret put ACCESS_CODE          # friend-group gate (e.g. medoc26)
#   wrangler secret put STRAVA_VERIFY_TOKEN  # vestigial (kept for webhook handshake)
#   wrangler secret put GITHUB_PAT           # vestigial (kept for webhook dispatch)
#
# Under the per-runner-app architecture, the Worker no longer needs a shared
# STRAVA_CLIENT_SECRET — runners' personal client_secrets pass through the
# /exchange-personal endpoint at exchange time and are never stored.

name = "medoc-26-webhook"
main = "worker.js"
compatibility_date = "2026-05-12"

# Pinned because the local wrangler OAuth token can't auto-list accounts
# (limited scopes) — without this, deploy/KV commands fail with "Failed to
# automatically retrieve account IDs". Account IDs aren't secret.
account_id = "22adf8f057dcd71a45dfbafb7c304273"

# Non-secret variables. None of these are sensitive — repo name is public,
# origin is the public Pages URL.
[vars]
GITHUB_REPO    = "fbmedoc/Marathon-Du-Medoc-Dashboard"
ALLOWED_ORIGIN = "https://fbmedoc.github.io"

# KV namespace for the self-select drinks tracker. Logs are stored one blob
# per runner under key `drinks:<runner_id>` (JSON map of date → drink count).
#
# Create it once, then paste the returned id below:
#   cd webhook
#   wrangler kv namespace create DRINKS
#   wrangler kv namespace create DRINKS --preview
#
# Then fill in id / preview_id from the command output.
[[kv_namespaces]]
binding    = "DRINKS"
id         = "13691b65b8ca4f5ba35d98a1a52f9a86"
preview_id = "9b8798a2629a4debad917aa55bf4bd01"

# Scheduled trigger — Cloudflare honours this to the minute (unlike GitHub
# Actions */5 cron, which gets throttled to 4-7 hour intervals on free tier).
# The Worker's scheduled() handler fires repository_dispatch to GitHub so
# the dashboard workflow rebuilds every 5 min reliably.
[triggers]
crons = ["*/5 * * * *"]

# The Worker will be reachable at:
#   https://medoc-26-webhook.<your-cloudflare-account>.workers.dev
# Custom domain is optional and not needed for Strava webhooks.
